spring:
  cloud:
    aws:
      s3:
        enabled: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    csrf:
      enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  data-init:
    mode: ${APP_DATA_INIT_MODE:none}  # none:더미데이터 필요 x | simple: 더미데이터 소량생성 | bulk : 더미데이터 대량생성
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-at-least-32-characters-long-for-hs256}
    access-cookie:
      secure: false
      same-site: Lax
      domain:
    refresh-cookie:
      secure: false
      same-site: Lax
      domain:

# 로컬에서는 S3/CloudFront 대신 LocalFileStorageService, LocalCloudFrontCookieSigner 사용
# → AWS 관련 env 없이 부팅되도록 placeholder를 빈 값으로 덮어쓴다.
cloud:
  aws:
    credentials:
      access-key: ""
      secret-key: ""
    s3:
      bucket: ""
    cloudfront:
      enabled: false
      distribution-domain: ""
      key-pair-id: ""
      private-key: ""

file:
  upload-dir: ${LOCAL_UPLOAD_DIR:./videos-local}
